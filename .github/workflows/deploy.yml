name: Release Images

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  PLATFORMS: linux/amd64

jobs:
  prep:
    runs-on: ubuntu-latest
    outputs:
      owner_lc: ${{ steps.lc.outputs.owner_lc }}
    steps:
      - name: Lowercase owner
        id: lc
        run: echo "owner_lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

  discover:
    name: Discover existing Dockerfiles
    runs-on: ubuntu-latest
    outputs:
      build_matrix: ${{ steps.gen.outputs.build_matrix }}
      deploy_matrix: ${{ steps.gen.outputs.deploy_matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: gen
        shell: bash
        run: |
          # Карта ожидаемых компонентов -> Dockerfile
          declare -A files=(
            [tgbot]=telegram_bot.Dockerfile
            [rag]=rag.Dockerfile
            [moderation_regex]=moderation_regex.Dockerfile
            [moderation_nlp]=moderation_nlp.Dockerfile
            [llm_agent]=llm_agent.Dockerfile
            [orchestrator]=orchestrator.Dockerfile
          )
          # Имена образов в GHCR и YC
          declare -A ghcr=(
            [tgbot]=labubu-tgbot
            [rag]=labubu-rag
            [moderation_regex]=labubu-moderation_regex
            [moderation_nlp]=labubu-moderation_nlp
            [llm_agent]=llm_agent
            [orchestrator]=orchestrator
          )
          declare -A yc=(
            [tgbot]=labubu-tgbot
            [rag]=labubu-rag
            [moderation_regex]=labubu-moderation_regex
            [moderation_nlp]=labubu-moderation-nlp
            [llm_agent]=labubu-llm_agent
            [orchestrator]=labubu-orchestrator
          )

          build_include=()
          deploy_include=()

          for name in "${!files[@]}"; do
            df="${files[$name]}"
            if [[ -f "$df" ]]; then
              build_include+=("{\"name\":\"$name\",\"dockerfile\":\"$df\",\"ghcr_image\":\"${ghcr[$name]}\",\"yc_image\":\"${yc[$name]}\"}")
              # Добавляем в deploy только те сервисы, у которых есть конфиг деплоя
              case "$name" in
                tgbot)
                  deploy_include+=("{\"name\":\"tgbot\",\"container\":\"tgbot\",\"yc_image\":\"${yc[$name]}\",\"cores\":1,\"memory\":\"1024Mb\",\"core_fraction\":20,\"concurrency\":8,\"timeout\":10,\"secrets\":\"TELEGRAM_TOKEN=e6qno2jsufp1d2i8n2km/latest/tg_token\nSERVICE_ACCOUNT_ID=e6qgn68inv1vekf3iib9/latest/SERVICE_ACCOUNT_ID\"}")
                  ;;
                rag)
                  deploy_include+=("{\"name\":\"rag\",\"container\":\"rag\",\"yc_image\":\"${yc[$name]}\",\"cores\":1,\"memory\":\"1024Mb\",\"core_fraction\":100,\"concurrency\":8,\"timeout\":10,\"secrets\":\"S3_ENDPOINT=e6qa6sntgejel6jqbmvb/latest/S3_ENDPOINT\nS3_ACCESS_KEY=e6qubg2fssalpqi6f8l9/latest/S3_ACCESS_KEY\nS3_SECRET_KEY=e6q3dqhcqot6nmid64m8/latest/S3_SECRET_KEY\nS3_BUCKET=e6qckd0l8je2ft50nlk6/latest/S3_BUCKET\"}")
                  ;;
                moderation_regex)
                  deploy_include+=("{\"name\":\"moderation_regex\",\"container\":\"moderation-regex\",\"yc_image\":\"${yc[$name]}\",\"cores\":1,\"memory\":\"2048Mb\",\"core_fraction\":20,\"concurrency\":8,\"timeout\":10,\"secrets\":\"\"}")
                  ;;
                moderation_nlp)
                  deploy_include+=("{\"name\":\"moderation_nlp\",\"container\":\"moderation-nlp\",\"yc_image\":\"${yc[$name]}\",\"cores\":4,\"memory\":\"4096Mb\",\"core_fraction\":100,\"concurrency\":8,\"timeout\":10,\"secrets\":\"\"}")
                  ;;
                orchestrator)
                  deploy_include+=("{\"name\":\"orchestrator\",\"container\":\"orchestrator\",\"yc_image\":\"${yc[$name]}\",\"cores\":2,\"memory\":\"2048Mb\",\"core_fraction\":50,\"concurrency\":8,\"timeout\":10,\"secrets\":\"\"}")
                  ;;
              esac
            fi
          done

          printf -v build_json '{"include":[%s]}' "$(IFS=,; echo "${build_include[*]}")"
          printf -v deploy_json '{"include":[%s]}' "$(IFS=,; echo "${deploy_include[*]}")"

          echo "build_matrix=$build_json"   >> "$GITHUB_OUTPUT"
          echo "deploy_matrix=$deploy_json" >> "$GITHUB_OUTPUT"

  build:
    name: Build (compute-heavy)
    needs: [ prep, discover ]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.build_matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image to tar (with cache)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./${{ matrix.dockerfile }}
          platforms: ${{ env.PLATFORMS }}
          tags: local/${{ matrix.name }}:build
          load: false
          push: false
          outputs: type=docker,dest=/tmp/${{ matrix.name }}.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.name }}
          path: /tmp/${{ matrix.name }}.tar
          if-no-files-found: error
          retention-days: 7

  push:
    name: Tag & Push to GHCR and YC
    needs: [ prep, discover, build ]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.build_matrix) }}
    steps:
      - name: Download built image
        uses: actions/download-artifact@v4
        with:
          name: image-${{ matrix.name }}
          path: /tmp

      - name: Load image
        run: docker load -i /tmp/${{ matrix.name }}.tar

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag for GHCR
        env:
          OWNER: ${{ needs.prep.outputs.owner_lc }}
        run: |
          GHCR_REPO=ghcr.io/$OWNER/${{ matrix.ghcr_image }}
          docker tag local/${{ matrix.name }}:build $GHCR_REPO:latest
          docker tag local/${{ matrix.name }}:build $GHCR_REPO:${{ github.run_number }}
          echo "GHCR_REPO=$GHCR_REPO" >> $GITHUB_ENV

      - name: Push GHCR
        run: |
          docker push "$GHCR_REPO:latest"
          docker push "$GHCR_REPO:${{ github.run_number }}"

      - name: Get Yandex Cloud IAM token
        id: yc-iam
        # контейнерная экшен (версия рабочая)
        uses: docker://ghcr.io/yc-actions/yc-iam-token-fed:1.0.0
        with:
          yc-sa-id: ${{ secrets.SA_ID }}

      - name: Login to YC Container Registry
        uses: docker/login-action@v3
        with:
          registry: cr.yandex
          username: iam
          password: ${{ steps.yc-iam.outputs.token }}

      - name: Tag for YC
        run: |
          YC_REPO=cr.yandex/${{ secrets.CONTAINER_REPO }}/${{ matrix.yc_image }}
          docker tag local/${{ matrix.name }}:build "$YC_REPO:latest"
          docker tag local/${{ matrix.name }}:build "$YC_REPO:${{ github.run_number }}"
          echo "YC_REPO=$YC_REPO" >> $GITHUB_ENV

      - name: Push YC
        run: |
          docker push "$YC_REPO:latest"
          docker push "$YC_REPO:${{ github.run_number }}"

  deploy:
    name: Deploy YC Serverless Containers
    needs: [ push, discover ]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.deploy_matrix) }}
    steps:
      - name: Deploy Serverless Container
        uses: yc-actions/yc-sls-container-deploy@v4
        with:
          yc-sa-id: ${{ secrets.SA_ID }}
          container-name: ${{ matrix.container }}
          folder-id: ${{ secrets.YC_FOLDER }}
          revision-service-account-id: ${{ secrets.SA_ID }}
          revision-cores: ${{ matrix.cores }}
          revision-memory: ${{ matrix.memory }}
          revision-core-fraction: ${{ matrix.core_fraction }}
          revision-concurrency: ${{ matrix.concurrency }}
          revision-image-url: cr.yandex/${{ secrets.CONTAINER_REPO }}/${{ matrix.yc_image }}:${{ github.run_number }}
          revision-execution-timeout: ${{ matrix.timeout }}
          revision-secrets: ${{ matrix.secrets }}
