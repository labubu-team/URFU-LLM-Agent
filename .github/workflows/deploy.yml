name: Release Images

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push_tgbot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase owner
        id: repo
        run: echo "owner_lc=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT

      - name: Build & push Telegram Bot image
        run: |
          REPO=ghcr.io/${{ steps.repo.outputs.owner_lc }}/labubu-tgbot
          docker build -f ./telegram_bot/Dockerfile -t $REPO:latest -t $REPO:${{ github.run_number }} .
          docker push $REPO:latest
          docker push $REPO:${{ github.run_number }}
    
      - name: YC Docker Auth
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash
          source "/home/runner/.bashrc" && \
          yc config profile create test && \
          yc config set folder-id ${{ secrets.YC_FOLDER }} && \
          yc config set organization-id ${{ secrets.YC_ORG_ID }} && \
          yc config list && \
          yc container registry configure-docker

      - name: Build & push Telegram Bot image YC_REPO
        run: |
          YC_REPO=cr.yandex/crpb6l14270hcph4dce5/labubu-tgbot
          docker build -f ./labubu-tgbot/Dockerfile -t $YC_REPO:latest -t $YC_REPO:${{ github.run_number }} .
          docker push $YC_REPO:latest
          docker push $YC_REPO:${{ github.run_number }}

