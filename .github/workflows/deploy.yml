name: Release Images

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  pages: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push_tgbot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase owner
        id: repo
        run: echo "owner_lc=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT

      - name: Build & push Telegram Bot image
        run: |
          REPO=ghcr.io/${{ steps.repo.outputs.owner_lc }}/labubu-tgbot
          docker build -f ./telegram_bot/Dockerfile -t $REPO:latest -t $REPO:${{ github.run_number }} .
          docker push $REPO:latest
          docker push $REPO:${{ github.run_number }}
    

      - name: Get Yandex Cloud IAM token
        id: get-iam-token
        uses: docker://ghcr.io/yc-actions/yc-iam-token-fed:1.0.0
        with:
          yc-sa-id: ${{ secrets.SERVICE_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: cr.yandex
          username: iam
          password: ${{ steps.get-iam-token.outputs.token }}
      
      - name: Build, tag, and push image to Yandex Cloud Container Registry
        run: |
          YC_REPO=cr.yandex/${{ secrets.CONTAINER_REPO }}/labubu-tgbot
          docker build -f ./telegram_bot/Dockerfile -t $YC_REPO:latest -t $YC_REPO:${{ github.run_number }} .
          docker push $YC_REPO:latest
          docker push $YC_REPO:${{ github.run_number }}

      # - name: YC Docker Auth
      #   run: |
      #     curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash
      #     source "/home/runner/.bashrc" && \
      #     yc config profile create test && \
      #     yc config set folder-id ${{ secrets.YC_FOLDER }} && \
      #     yc config set organization-id ${{ secrets.YC_ORG_ID }} && \
      #     yc config list && \
      #     yc container registry configure-docker


